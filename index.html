<script>

const SUPABASE_URL =
"https://jnkeffwgnjjebujrcprb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_q0UFEgWWvBZLXPlEwLX01w_HhK47RtP";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
LOGIN
========================= */

const loginButton =
document.getElementById("loginButton");

const loginModal =
document.getElementById("loginModal");

const closeButton =
document.getElementById("closeButton");

const submitButton =
document.getElementById("submitButton");

const switchMode =
document.getElementById("switchMode");

const forgotPassword =
document.getElementById("forgotPassword");

const modalTitle =
document.getElementById("modalTitle");

const message =
document.getElementById("message");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const resetBox =
document.getElementById("resetBox");

const newPassword =
document.getElementById("newPassword");

const resetButton =
document.getElementById("resetButton");

let registerMode = false;


loginButton.onclick = async function(){

const {data} =
await supabaseClient.auth.getUser();

if(data.user){

await supabaseClient.auth.signOut();

loginButton.innerText="เข้าสู่ระบบ";

return;

}

loginModal.style.display="flex";

};


closeButton.onclick=function(){

loginModal.style.display="none";

message.innerText="";

};


switchMode.onclick=function(){

registerMode=!registerMode;

if(registerMode){

modalTitle.innerText="สมัครสมาชิก";

submitButton.innerText="สมัครสมาชิก";

switchMode.innerText=
"มีบัญชีแล้ว? เข้าสู่ระบบ";

}else{

modalTitle.innerText="เข้าสู่ระบบ";

submitButton.innerText="เข้าสู่ระบบ";

switchMode.innerText=
"ยังไม่มีบัญชี? สมัครสมาชิก";

}

};


submitButton.onclick=async function(){

const email =
emailInput.value.trim();

const password =
passwordInput.value;

if(!email || !password){

message.innerText=
"กรุณากรอกอีเมลและรหัสผ่าน";

return;

}

message.innerText=
"กำลังดำเนินการ...";


if(registerMode){

const {error} =
await supabaseClient.auth.signUp({
email:email,
password:password
});

if(error){

message.innerText=
error.message;

}else{

message.innerText=
"สมัครสมาชิกสำเร็จ! กรุณาตรวจสอบอีเมล";

}

}else{

const {error} =
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){

message.innerText=
error.message;

}else{

message.innerText=
"เข้าสู่ระบบสำเร็จ!";

loginButton.innerText=
"ออกจากระบบ";

setTimeout(function(){

loginModal.style.display="none";

loadProducts();

},1000);

}

}

};


forgotPassword.onclick=async function(){

const email =
emailInput.value.trim();

if(!email){

message.innerText=
"กรุณากรอกอีเมลก่อน";

return;

}

const {error} =
await supabaseClient.auth.resetPasswordForEmail(
email,
{
redirectTo:
"https://s2ozgamer.github.io/PC2Deal/"
}
);

if(error){

message.innerText=
error.message;

}else{

message.innerText=
"ส่งลิงก์เปลี่ยนรหัสผ่านไปที่อีเมลแล้ว";

}

};


supabaseClient.auth.onAuthStateChange(
async function(event){

if(event==="PASSWORD_RECOVERY"){

loginModal.style.display="flex";

modalTitle.innerText=
"ตั้งรหัสผ่านใหม่";

emailInput.style.display="none";

passwordInput.style.display="none";

submitButton.style.display="none";

switchMode.style.display="none";

forgotPassword.style.display="none";

resetBox.style.display="block";

}

});


resetButton.onclick=async function(){

const password =
newPassword.value;

if(password.length<6){

message.innerText=
"รหัสผ่านต้องมีอย่างน้อย 6 ตัว";

return;

}

const {error} =
await supabaseClient.auth.updateUser({
password:password
});

if(error){

message.innerText=
error.message;

}else{

message.innerText=
"เปลี่ยนรหัสผ่านสำเร็จแล้ว!";

setTimeout(function(){

loginModal.style.display="none";

location.reload();

},1500);

}

};


async function checkUser(){

const {data} =
await supabaseClient.auth.getUser();

if(data.user){

loginButton.innerText=
"ออกจากระบบ";

}

}



/* =========================
SELL PRODUCT
========================= */

const sellButton =
document.getElementById("sellButton");

const sellModal =
document.getElementById("sellModal");

const closeSellButton =
document.getElementById("closeSellButton");

const publishButton =
document.getElementById("publishButton");

const sellMessage =
document.getElementById("sellMessage");

const productImage =
document.getElementById("productImage");

const imagePreview =
document.getElementById("imagePreview");


/* PREVIEW IMAGE */

productImage.addEventListener(
"change",
function(){

const file =
productImage.files[0];

if(!file){

imagePreview.style.display="none";

return;

}

if(!file.type.startsWith("image/")){

sellMessage.innerText=
"กรุณาเลือกไฟล์รูปภาพ";

productImage.value="";

return;

}

const reader =
new FileReader();

reader.onload=function(event){

imagePreview.src=
event.target.result;

imagePreview.style.display=
"block";

};

reader.readAsDataURL(file);

});


sellButton.onclick=async function(){

const {data} =
await supabaseClient.auth.getUser();

if(!data.user){

loginModal.style.display="flex";

message.innerText=
"กรุณาเข้าสู่ระบบก่อนลงขายสินค้า";

return;

}

sellModal.style.display="flex";

};


closeSellButton.onclick=function(){

sellModal.style.display="none";

sellMessage.innerText="";

};



/* PUBLISH */

publishButton.onclick=async function(){

const {data} =
await supabaseClient.auth.getUser();

const user =
data.user;

if(!user){

sellMessage.innerText=
"กรุณาเข้าสู่ระบบก่อน";

return;

}


const title =
document.getElementById("productTitle")
.value.trim();

const price =
document.getElementById("productPrice")
.value;

const location =
document.getElementById("productLocation")
.value.trim();

const description =
document.getElementById("productDescription")
.value.trim();

const file =
productImage.files[0];


if(!title){

sellMessage.innerText=
"กรุณาใส่ชื่อสินค้า";

return;

}

if(!price){

sellMessage.innerText=
"กรุณาใส่ราคา";

return;

}


/* CHECK IMAGE */

if(file){

if(!file.type.startsWith("image/")){

sellMessage.innerText=
"ไฟล์ต้องเป็นรูปภาพเท่านั้น";

return;

}


/* จำกัดขนาด 5MB */

if(file.size > 5 * 1024 * 1024){

sellMessage.innerText=
"รูปต้องมีขนาดไม่เกิน 5MB";

return;

}

}


publishButton.disabled=true;

publishButton.innerText=
"กำลังลงขาย...";


let image_url = "";


/* =========================
UPLOAD IMAGE
========================= */

if(file){

sellMessage.innerText=
"กำลังอัปโหลดรูป...";


const extension =
file.name.split(".").pop();

const fileName =
user.id +
"/" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
extension;


const {error:uploadError} =
await supabaseClient
.storage
.from("product-images")
.upload(
fileName,
file,
{
contentType:file.type,
upsert:false
}
);


if(uploadError){

console.error(uploadError);

publishButton.disabled=false;

publishButton.innerText=
"ลงขายสินค้า";

sellMessage.innerText=
"อัปโหลดรูปไม่สำเร็จ: "+
uploadError.message;

return;

}


/* GET PUBLIC URL */

const {data:publicData} =
supabaseClient
.storage
.from("product-images")
.getPublicUrl(fileName);

image_url =
publicData.publicUrl;

}


/* =========================
SAVE PRODUCT
========================= */

sellMessage.innerText=
"กำลังบันทึกสินค้า...";


const {error} =
await supabaseClient
.from("products")
.insert({

user_id:user.id,

title:title,

price:Number(price),

location:location,

description:description,

image_url:image_url

});


publishButton.disabled=false;

publishButton.innerText=
"ลงขายสินค้า";


if(error){

console.error(error);

sellMessage.innerText=
"เกิดข้อผิดพลาด: "+
error.message;

return;

}


sellMessage.innerText=
"ลงขายสินค้าเรียบร้อยแล้ว!";


document.getElementById(
"productTitle"
).value="";

document.getElementById(
"productPrice"
).value="";

document.getElementById(
"productLocation"
).value="";

document.getElementById(
"productDescription"
).value="";

productImage.value="";

imagePreview.src="";

imagePreview.style.display=
"none";


setTimeout(function(){

sellModal.style.display="none";

sellMessage.innerText="";

loadProducts();

},1000);

};



/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(searchText=""){

const productsBox =
document.getElementById("products");

productsBox.innerHTML=
'<div class="empty">กำลังโหลดสินค้า...</div>';


let query =
supabaseClient
.from("products")
.select("*")
.eq("status","active")
.order("created_at",{ascending:false});


if(searchText){

query =
query.or(
"title.ilike.%"+
searchText+
"%,description.ilike.%"+
searchText+
"%"
);

}


const {data,error} =
await query;


if(error){

console.error(error);

productsBox.innerHTML=
'<div class="empty">ไม่สามารถโหลดสินค้าได้</div>';

return;

}


if(!data || data.length===0){

productsBox.innerHTML=
'<div class="empty">ยังไม่มีสินค้าที่ลงขาย</div>';

return;

}


productsBox.innerHTML="";


data.forEach(function(product){

const card =
document.createElement("div");

card.className="card";


let imageHTML =
'<div class="image">🖥️</div>';


if(product.image_url){

imageHTML =
'<div class="image">'+
'<img src="'+
escapeHTML(product.image_url)+
'" alt="สินค้า">'+
'</div>';

}


card.innerHTML =

imageHTML+

'<div class="info">'+

'<h3>'+
escapeHTML(product.title)+
'</h3>'+

'<div class="price">'+
Number(product.price)
.toLocaleString()+
' บาท</div>'+

'<div class="location">📍 '+
escapeHTML(
product.location ||
"ไม่ระบุ"
)+
'</div>'+

(product.description ?

'<div class="description">'+
escapeHTML(
product.description
)+
'</div>'

:

"")+

'</div>';


productsBox.appendChild(card);

});

}



/* =========================
SECURITY
========================= */

function escapeHTML(text){

const div =
document.createElement("div");

div.textContent =
text || "";

return div.innerHTML;

}



/* =========================
SEARCH
========================= */

const searchInput =
document.getElementById("searchInput");

const searchButton =
document.getElementById("searchButton");


searchButton.onclick=function(){

loadProducts(
searchInput.value.trim()
);

};


searchInput.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

loadProducts(
searchInput.value.trim()
);

}

});



/* =========================
START
========================= */

checkUser();

loadProducts();

</script>

</body>
</html>
