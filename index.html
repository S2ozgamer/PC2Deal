<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC2Deal - ตลาดซื้อขายคอมมือสอง</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.65;
}

header{
  background:#111827;
  color:white;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:#60a5fa;
  white-space:nowrap;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.header-btn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#1f2937;
  color:white;
  font-size:14px;
}

.header-btn:hover{
  background:#374151;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:99px;
  background:#ef4444;
  color:white;
  font-size:11px;
  font-weight:bold;
  margin-left:4px;
}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:48px 20px;
  text-align:center;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  opacity:.9;
  margin-bottom:24px;
}

.search-box{
  max-width:720px;
  margin:auto;
  display:flex;
  gap:8px;
}

.search-box input{
  flex:1;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  outline:none;
}

.search-box button{
  border:0;
  border-radius:12px;
  padding:0 20px;
  background:#111827;
  color:white;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 18px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:10px;
}

.section-head h2{
  font-size:24px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

.product-card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.product-image{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#e5e7eb;
}

.product-content{
  padding:15px;
}

.product-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
  line-height:1.4;
}

.price{
  font-size:22px;
  color:#2563eb;
  font-weight:bold;
  margin-bottom:7px;
}

.location{
  color:#6b7280;
  font-size:13px;
  margin-bottom:7px;
}

.seller{
  font-size:13px;
  color:#374151;
  margin-bottom:10px;
}

.rating{
  color:#f59e0b;
  font-weight:bold;
}

.card-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  font-weight:bold;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-warning{
  background:#f59e0b;
  color:white;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:50px 20px;
  background:white;
  border-radius:15px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:500;
}

.modal.active{
  display:flex;
}

.modal-box{
  background:white;
  width:100%;
  max-width:620px;
  max-height:92vh;
  overflow:auto;
  border-radius:16px;
  padding:22px;
  position:relative;
}

.modal-box.large{
  max-width:850px;
}

.close{
  position:absolute;
  right:15px;
  top:12px;
  border:0;
  background:none;
  font-size:28px;
  color:#6b7280;
}

.modal-title{
  font-size:23px;
  font-weight:bold;
  margin-bottom:18px;
  padding-right:35px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:11px;
  outline:none;
  font-size:15px;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:#2563eb;
}

.auth-switch{
  text-align:center;
  margin-top:14px;
  color:#6b7280;
}

.auth-switch button{
  border:0;
  background:none;
  color:#2563eb;
  font-weight:bold;
}

.detail-image{
  width:100%;
  max-height:390px;
  object-fit:contain;
  border-radius:12px;
  background:#f3f4f6;
  margin-bottom:18px;
}

.detail-title{
  font-size:27px;
  font-weight:bold;
  margin-bottom:8px;
}

.detail-price{
  font-size:28px;
  color:#2563eb;
  font-weight:bold;
  margin-bottom:12px;
}

.detail-info{
  background:#f9fafb;
  padding:13px;
  border-radius:10px;
  margin-bottom:15px;
}

.detail-description{
  white-space:pre-wrap;
  line-height:1.7;
  margin-bottom:15px;
}

.detail-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:18px;
  border-bottom:1px solid #e5e7eb;
  padding-bottom:8px;
}

.tab{
  border:0;
  background:#f3f4f6;
  padding:10px 16px;
  border-radius:9px;
  font-weight:bold;
}

.tab.active{
  background:#2563eb;
  color:white;
}

.order-card{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.order-title{
  font-weight:bold;
  font-size:17px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.status-pending{
  background:#fef3c7;
  color:#92400e;
}

.status-confirmed{
  background:#dbeafe;
  color:#1e40af;
}

.status-shipping{
  background:#ede9fe;
  color:#5b21b6;
}

.status-shipped{
  background:#cffafe;
  color:#155e75;
}

.status-completed{
  background:#dcfce7;
  color:#166534;
}

.status-cancelled{
  background:#fee2e2;
  color:#991b1b;
}

.order-meta{
  color:#6b7280;
  font-size:13px;
  line-height:1.7;
}

.order-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.review-action{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #e5e7eb;
}

.review-action .btn{
  width:100%;
}

.review-box{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
}

.review-item{
  padding:11px 0;
  border-bottom:1px solid #e5e7eb;
}

.review-item:last-child{
  border-bottom:0;
}

.review-stars{
  color:#f59e0b;
  letter-spacing:1px;
}

.review-comment{
  margin-top:5px;
  line-height:1.5;
}

.review-user{
  font-size:12px;
  color:#6b7280;
  margin-top:4px;
}

.star-select{
  display:flex;
  gap:4px;
  margin:10px 0 16px;
}

.star-btn{
  border:0;
  background:none;
  font-size:34px;
  color:#d1d5db;
  padding:0;
}

.star-btn.selected{
  color:#f59e0b;
}

.inbox-item{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:13px;
  margin-bottom:9px;
  cursor:pointer;
}

.inbox-item:hover{
  background:#eff6ff;
}

.inbox-title{
  font-weight:bold;
}

.inbox-preview{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.chat-messages{
  height:380px;
  overflow:auto;
  background:#f3f4f6;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
}

.message{
  max-width:78%;
  padding:9px 12px;
  border-radius:12px;
  margin-bottom:8px;
  line-height:1.5;
  word-break:break-word;
}

.message.mine{
  margin-left:auto;
  background:#2563eb;
  color:white;
}

.message.other{
  margin-right:auto;
  background:white;
}

.message-time{
  font-size:10px;
  opacity:.7;
  margin-top:3px;
}

.chat-input{
  display:flex;
  gap:7px;
}

.chat-input input{
  flex:1;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:11px;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#111827;
  color:white;
  padding:13px 16px;
  border-radius:10px;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
  display:none;
  z-index:1000;
  max-width:350px;
  white-space:pre-line;
}

.toast.show{
  display:block;
  animation:fadein .2s;
}

@keyframes fadein{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.loading{
  text-align:center;
  padding:40px;
  color:#6b7280;
}

@media(max-width:650px){
  header{
    padding:11px;
  }

  .logo{
    font-size:20px;
  }

  .header-btn{
    padding:7px 8px;
    font-size:12px;
  }

  .hero{
    padding:35px 14px;
  }

  .hero h1{
    font-size:29px;
  }

  .search-box{
    flex-direction:column;
  }

  .search-box button{
    padding:12px;
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .product-image{
    height:140px;
  }

  .product-content{
    padding:10px;
  }

  .product-title{
    font-size:15px;
  }

  .price{
    font-size:18px;
  }

  .card-actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .modal-box{
    padding:17px;
  }

  .order-head{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">PC2Deal</div>

  <div class="header-right">

    <button id="orderButton" class="header-btn" style="display:none">
      📦 ออเดอร์
      <span id="orderBadge" class="badge" style="display:none">0</span>
    </button>

    <button id="messageButton" class="header-btn" style="display:none">
      💬 ข้อความ
      <span id="messageBadge" class="badge" style="display:none">0</span>
    </button>

    <button id="sellButton" class="header-btn" style="display:none">
      ➕ ลงขาย
    </button>

    <button id="authButton" class="header-btn">
      เข้าสู่ระบบ
    </button>

  </div>
</header>

<section class="hero">

  <h1>ตลาดซื้อขายคอมมือสอง</h1>

  <p>
    ซื้อ ขาย แลกเปลี่ยน PC และอุปกรณ์คอมพิวเตอร์กับคนไทย
  </p>

  <div class="search-box">

    <input
      id="searchInput"
      placeholder="ค้นหา GTX 1650, i5, RAM, SSD..."
    >

    <button id="searchButton">
      🔎 ค้นหา
    </button>

  </div>

</section>

<main class="container">

  <div class="section-head">

    <h2>🔥 สินค้าล่าสุด</h2>

    <button
      class="btn btn-primary"
      id="refreshButton"
    >
      รีเฟรช
    </button>

  </div>

  <div id="products" class="products">
    <div class="loading">
      กำลังโหลดสินค้า...
    </div>
  </div>

</main>


<!-- AUTH MODAL -->

<div id="authModal" class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('authModal')"
    >
      ×
    </button>

    <div
      class="modal-title"
      id="authTitle"
    >
      เข้าสู่ระบบ
    </div>

    <form id="authForm">

      <div class="form-group">

        <label>อีเมล</label>

        <input
          id="authEmail"
          type="email"
          required
        >

      </div>

      <div class="form-group">

        <label>รหัสผ่าน</label>

        <input
          id="authPassword"
          type="password"
          required
          minlength="6"
        >

      </div>

      <button
        class="btn btn-primary"
        style="width:100%"
        type="submit"
      >
        <span id="authSubmitText">
          เข้าสู่ระบบ
        </span>
      </button>

    </form>

    <div class="auth-switch">

      <button id="toggleAuthMode">
        ยังไม่มีบัญชี? สมัครสมาชิก
      </button>

    </div>

    <div class="auth-switch">

      <button id="forgotPassword">
        ลืมรหัสผ่าน?
      </button>

    </div>

  </div>

</div>


<!-- SELL MODAL -->

<div id="sellModal" class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('sellModal')"
    >
      ×
    </button>

    <div class="modal-title">
      ลงขายสินค้า
    </div>

    <form id="sellForm">

      <div class="form-group">

        <label>ชื่อสินค้า</label>

        <input
          id="sellTitle"
          required
          placeholder="เช่น GTX 1650 ASUS 4GB"
        >

      </div>

      <div class="form-group">

        <label>ราคา</label>

        <input
          id="sellPrice"
          type="number"
          min="0"
          required
        >

      </div>

      <div class="form-group">

        <label>จังหวัด / พื้นที่</label>

        <input
          id="sellLocation"
          required
          placeholder="เช่น ชลบุรี"
        >

      </div>

      <div class="form-group">

        <label>รายละเอียด</label>

        <textarea
          id="sellDescription"
          placeholder="รายละเอียดสินค้า สภาพ ประกัน ฯลฯ"
        ></textarea>

      </div>

      <div class="form-group">

        <label>รูปสินค้า</label>

        <input
          id="sellImage"
          type="file"
          accept="image/*"
          required
        >

      </div>

      <button
        class="btn btn-primary"
        style="width:100%"
        type="submit"
      >
        ลงขายสินค้า
      </button>

    </form>

  </div>

</div>


<!-- PRODUCT DETAIL -->

<div id="detailModal" class="modal">

  <div class="modal-box large">

    <button
      class="close"
      onclick="closeModal('detailModal')"
    >
      ×
    </button>

    <div id="productDetail"></div>

  </div>

</div>


<!-- CREATE ORDER -->

<div id="orderCreateModal" class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('orderCreateModal')"
    >
      ×
    </button>

    <div class="modal-title">
      🛒 สั่งซื้อสินค้า
    </div>

    <div id="createOrderProduct"></div>

    <form id="createOrderForm">

      <div class="form-group">

        <label>ชื่อผู้รับ</label>

        <input
          id="buyerName"
          required
        >

      </div>

      <div class="form-group">

        <label>เบอร์โทรศัพท์</label>

        <input
          id="buyerPhone"
          required
        >

      </div>

      <div class="form-group">

        <label>ที่อยู่จัดส่ง</label>

        <textarea
          id="buyerAddress"
          required
        ></textarea>

      </div>

      <button
        class="btn btn-success"
        style="width:100%"
        type="submit"
      >
        ยืนยันการสั่งซื้อ
      </button>

    </form>

  </div>

</div>


<!-- ORDER MODAL -->

<div id="ordersModal" class="modal">

  <div class="modal-box large">

    <button
      class="close"
      onclick="closeModal('ordersModal')"
    >
      ×
    </button>

    <div class="modal-title">
      📦 ออเดอร์ของฉัน
    </div>

    <div class="tabs">

      <button
        class="tab active"
        id="buyerTab"
      >
        🛒 ซื้อ
      </button>

      <button
        class="tab"
        id="sellerTab"
      >
        🏪 ขาย
      </button>

    </div>

    <div id="ordersList"></div>

  </div>

</div>


<!-- REVIEW MODAL -->

<div id="reviewModal" class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('reviewModal')"
    >
      ×
    </button>

    <div class="modal-title">
      ⭐ ให้คะแนนผู้ขาย
    </div>

    <div id="reviewProductInfo"></div>

    <div class="form-group">

      <label>คะแนน</label>

      <div class="star-select">

        <button
          type="button"
          class="star-btn"
          data-star="1"
        >
          ★
        </button>

        <button
          type="button"
          class="star-btn"
          data-star="2"
        >
          ★
        </button>

        <button
          type="button"
          class="star-btn"
          data-star="3"
        >
          ★
        </button>

        <button
          type="button"
          class="star-btn"
          data-star="4"
        >
          ★
        </button>

        <button
          type="button"
          class="star-btn"
          data-star="5"
        >
          ★
        </button>

      </div>

    </div>

    <div class="form-group">

      <label>รีวิว</label>

      <textarea
        id="reviewComment"
        placeholder="บอกประสบการณ์การซื้อขายของคุณ..."
      ></textarea>

    </div>

    <button
      id="submitReviewButton"
      class="btn btn-primary"
      style="width:100%"
    >
      ส่งรีวิว
    </button>

  </div>

</div>


<!-- INBOX -->

<div id="inboxModal" class="modal">

  <div class="modal-box large">

    <button
      class="close"
      onclick="closeModal('inboxModal')"
    >
      ×
    </button>

    <div class="modal-title">
      💬 ข้อความ
    </div>

    <div id="inboxList"></div>

  </div>

</div>


<!-- CHAT -->

<div id="chatModal" class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal('chatModal')"
    >
      ×
    </button>

    <div
      class="modal-title"
      id="chatTitle"
    >
      💬 แชต
    </div>

    <div
      id="chatMessages"
      class="chat-messages"
    ></div>

    <div class="chat-input">

      <input
        id="chatInput"
        placeholder="พิมพ์ข้อความ..."
      >

      <button
        id="sendMessageButton"
        class="btn btn-primary"
      >
        ส่ง
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

const SUPABASE_KEY =

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("active");

}


function openModal(id){

  document
    .getElementById(id)
    .classList.add("active");

}


function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },3500);

}


function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatPrice(price){

  return Number(price || 0)
    .toLocaleString("th-TH");

}


function formatDate(date){

  if(!date) return "";

  return new Date(date)
    .toLocaleString(
      "th-TH",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    );

}


function statusText(status){

  const normalized =
    String(status || "")
      .trim()
      .toLowerCase();

  const map = {

    pending:"รอผู้ขายยืนยัน",

    confirmed:"ผู้ขายยืนยันแล้ว",

    shipping:"กำลังจัดส่ง",

    shipped:"จัดส่งแล้ว",

    completed:"ซื้อขายสำเร็จ",

    cancelled:"ยกเลิก"

  };

  return map[normalized] ||
    status ||
    "ไม่ทราบสถานะ";

}


function statusClass(status){

  const normalized =
    String(status || "")
      .trim()
      .toLowerCase();

  return "status-" + normalized;

}


function starsHTML(rating){

  const r =
    Math.max(
      0,
      Math.min(
        5,
        Math.round(
          Number(rating || 0)
        )
      )
    );

  return "★".repeat(r) +
    "☆".repeat(5-r);

}

async function getSellerRating(userId){

  if(!userId){

    return {
      average:0,
      count:0
    };

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("reviews")
      .select("rating")
      .eq(
        "seller_id",
        userId
      );


  if(
    error ||
    !data ||
    data.length === 0
  ){

    return {
      average:0,
      count:0
    };

  }


  const total =
    data.reduce(
      (sum,item)=>
        sum +
        Number(
          item.rating || 0
        ),
      0
    );


  return {

    average:
      total / data.length,

    count:
      data.length

  };

}

async function sellProduct(
  event
){

  event.preventDefault();


  if(!currentUser){

    alert(
      "กรุณาเข้าสู่ระบบก่อน"
    );

    return;

  }


  const title =
    document
      .getElementById(
        "sellTitle"
      )
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById(
          "sellPrice"
        )
        .value
    );


  const location =
    document
      .getElementById(
        "sellLocation"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "sellDescription"
      )
      .value
      .trim();


  const file =
    document
      .getElementById(
        "sellImage"
      )
      .files[0];


  if(!file){

    alert(
      "กรุณาเลือกรูปสินค้า"
    );

    return;

  }


  try{

    showToast(
      "กำลังอัปโหลดรูป..."
    );


    const ext =
      file.name
        .split(".")
        .pop();


    const filename =
      `${currentUser.id}/${Date.now()}.${ext}`;


    const {
      error:uploadError
    } =
      await supabaseClient
        .storage
        .from(
          "product-images"
        )
        .upload(
          filename,
          file,
          {
            upsert:false
          }
        );


    if(uploadError){

      throw uploadError;

    }


    const {
      data:publicData
    } =
      supabaseClient
        .storage
        .from(
          "product-images"
        )
        .getPublicUrl(
          filename
        );


    const imageUrl =
      publicData.publicUrl;


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .insert({

          user_id:
            currentUser.id,

          title,

          price,

          location,

          description,

          image_url:
            imageUrl,

          status:
            "active"

        });


    if(error){

      throw error;

    }


    document
      .getElementById(
        "sellForm"
      )
      .reset();


    closeModal(
      "sellModal"
    );


    showToast(
      "ลงขายสินค้าเรียบร้อย"
    );


    await loadProducts();

  }catch(error){

    console.error(error);

    alert(
      "ลงขายไม่สำเร็จ: " +
      error.message
    );

  }

}

      error
    );

    return false;

  }


  return !!data;

}


/*
  จุดสำคัญ:
  ปุ่มรีวิวตรวจจาก buyer_id
  โดยตรง ไม่พึ่ง orderMode
*/

async function renderOrderCard(
  order
){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "order-card";


  const normalizedStatus =
    String(
      order.status || ""
    )
      .trim()
      .toLowerCase();


  const isBuyer =
    String(
      order.buyer_id || ""
    ) ===
    String(
      currentUser?.id ||
      currentUserId ||
      ""
    );


  const isSeller =
    String(
      order.seller_id || ""
    ) ===
    String(
      currentUser?.id ||
      currentUserId ||
      ""
    );


  let actions = "";


  /*
    SELLER ACTIONS
  */

  if(isSeller){

    if(
      normalizedStatus ===
      "pending"
    ){

      actions = `

        <button
          class="btn btn-success confirm-btn"
        >
          ✅ ยืนยันออเดอร์
        </button>

        <button
          class="btn btn-danger cancel-btn"
        >
          ❌ ยกเลิก
        </button>

    }else if(
      normalizedStatus ===
      "confirmed"
    ){

      actions = `

        <button
          class="btn btn-primary shipping-btn"
        >
          🚚 ส่งสินค้า
        </button>

        <button
          class="btn btn-danger cancel-btn"
        >
          ❌ ยกเลิก
        </button>

      `;

    }else if(
      normalizedStatus ===
      "shipping"
    ){

      actions = `

        <button
          class="btn btn-primary shipped-btn"
        >
          📦 แจ้งจัดส่งแล้ว
        </button>

      `;

    }

  }


  /*
    BUYER ACTIONS
  */

  if(isBuyer){

    if(
      normalizedStatus ===
      "pending"
    ){

      actions += `

        <button
          class="btn btn-danger cancel-btn"
        >
          ❌ ยกเลิกออเดอร์

      `;

    }else if(
      normalizedStatus ===
      "shipped"

      actions += `

        <button
          class="btn btn-success completed-btn"

  /*

    เพื่อไม่ให้ CSS หรือ action อื่น
    ทำให้ปุ่มหาย
  */

  let reviewHTML = "";


  if(
    isBuyer &&
    normalizedStatus ===
    "completed"
  ){

    const alreadyReviewed =
      await hasReview(
        order.id
      );


    if(alreadyReviewed){

      reviewHTML = `

        <div class="review-action">

          <button
            class="btn btn-secondary"
            disabled
          >
            ⭐ รีวิวแล้ว
          </button>

        </div>

      `;

    }else{

      reviewHTML = `

        <div class="review-action">

          <button
            class="btn btn-warning review-btn"
          >
            ⭐ ให้คะแนนผู้ขาย
          </button>

        </div>

      `;

    }

  }


  /*
    ORDER HTML
  */

  card.innerHTML = `

    <div class="order-head">

      <div class="order-title">
        ${escapeHTML(
          order.product_title
        )}
      </div>

      <span
        class="status ${statusClass(
          normalizedStatus
        )}"
      >
        ${statusText(
          normalizedStatus
        )}
      </span>

    </div>


    <div class="price">
      ฿${formatPrice(
        order.price
      )}
    </div>


    <div class="order-meta">

      📅 ${formatDate(
        order.created_at
      )}

      <br>

      ${
        isBuyer
        ?
        "🏪 ผู้ขาย: กำลังโหลด..."
        :
        "🛒 ผู้ซื้อ: " +
        escapeHTML(
          order.buyer_name ||
          "-"
        )
      }

      ${
        isSeller
        ?
        `
          <br>
          📞 ${escapeHTML(
            order.buyer_phone ||
            "-"
          )}

          <br>
          📍 ${escapeHTML(
            order.buyer_address ||
            "-"
          )}
        `
        :
        ""
      }

    </div>


    ${

      ?
      `

          ${actions}
        </div>
      `
      :
      ""
    }


    ${reviewHTML}

  */

  if(isBuyer){

    const sellerLine =
      card.querySelector(

  card

          order

      }
    );


  return card;

========================= */

async function changeOrderStatus(
  order,
  newStatus
){

  if(!currentUser) return;


  const isSeller =
    String(
      order.seller_id
    ) ===
    String(
      currentUser.id
    );


  const isBuyer =
    String(
      order.buyer_id
    ) ===
    String(
      currentUser.id
    );


  if(
    newStatus === "confirmed" ||
    newStatus === "shipping" ||
    newStatus === "shipped"
  ){

    if(!isSeller){

      alert(
        "เฉพาะผู้ขายเท่านั้นที่ทำรายการนี้ได้"
      );

      return;

    }

  }


  if(
    newStatus === "completed"
  ){

    if(!isBuyer){

      alert(
        "เฉพาะผู้ซื้อเท่านั้นที่ยืนยันรับสินค้าได้"
      );

      return;

    }

  }


  if(
    newStatus === "cancelled"
  ){

    if(
      !isBuyer &&
      !isSeller
    ){

      alert(
        "ไม่มีสิทธิ์"
      );

      return;

    }

  }


  const confirmText = {

    confirmed:
      "ยืนยันออเดอร์นี้หรือไม่?",

    shipping:
      "ยืนยันว่าจะส่งสินค้าให้ออเดอร์นี้หรือไม่?",

    shipped:
      "ยืนยันว่าได้จัดส่งสินค้าแล้วหรือไม่?",

    completed:
      "ยืนยันว่าได้รับสินค้าและซื้อขายสำเร็จแล้วหรือไม่?",

    cancelled:
      "ต้องการยกเลิกออเดอร์นี้หรือไม่?"

  };


  if(
    !confirm(
      confirmText[newStatus] ||
      "ยืนยันการเปลี่ยนสถานะ?"
    )
  ){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("orders")
      .update({

        status:
          newStatus,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        order.id
      );


  if(error){

    console.error(error);

    alert(
      "เปลี่ยนสถานะไม่สำเร็จ: " +
      error.message
    );

    return;

  }


  /*
    เปลี่ยนสถานะสินค้า
  */

  if(
    newStatus ===
    "confirmed"
  ){

    await supabaseClient
      .from("products")
      .update({
        status:"reserved"
      })
      .eq(
        "id",
        order.product_id
      );

  }


  if(
    newStatus ===
    "cancelled"
  ){

    await supabaseClient
      .from("products")
      .update({
        status:"active"
      })
      .eq(
        "id",
        order.product_id
      );

  }


  if(
    newStatus ===
    "completed"
  ){

    await supabaseClient
      .from("products")
      .update({
        status:"sold"
      })
      .eq(
        "id",
        order.product_id
      );

  }


  showToast(
    "เปลี่ยนสถานะเป็น " +
    statusText(newStatus)
  );


  await loadOrders();

  await updateOrderBadge();

}

function selectRating(
  value
){

  selectedRating =
    Number(value);


  document
    .querySelectorAll(
      ".star-btn"
    )
    .forEach(
      btn=>{

        const star =
          Number(
            btn.dataset.star
          );


        btn.classList.toggle(
          "selected",
          star <=
          selectedRating
        );

      }
    );

}


async function submitReview(){

  if(
    !currentUser ||
    !currentOrder
  ){

    alert(
      "ข้อมูลไม่ครบ"
    );

    return;

  }


  const normalizedStatus =
    String(
      currentOrder.status ||
      ""
    )
      .trim()
      .toLowerCase();


  if(
    normalizedStatus !==
    "completed"
  ){

    alert(
      "สามารถรีวิวได้หลังซื้อขายสำเร็จเท่านั้น"
    );

    return;

  }


  if(
    String(
      currentOrder.buyer_id
    ) !==
    String(
      currentUser.id
    )
  ){

    alert(
      "เฉพาะผู้ซื้อเท่านั้นที่รีวิวได้"
    );

    return;

  }


  if(
    selectedRating < 1 ||
    selectedRating > 5
  ){

    alert(
      "กรุณาเลือกคะแนน 1–5 ดาว"
    );

    return;

  }


  const comment =
    document
      .getElementById(
        "reviewComment"
      )
      .value
      .trim();


  const {
    error
  } =
    await supabaseClient
      .from("reviews")
      .insert({

        order_id:
          currentOrder.id,

        reviewer_id:
          currentUser.id,

        seller_id:
          currentOrder.seller_id,

        rating:
          selectedRating,

        comment:
          comment || null

      });


  if(error){

    console.error(error);

    if(
      error.code ===
      "23505"
    ){

      alert(
        "ออเดอร์นี้รีวิวไปแล้ว"
      );

    }else{

      alert(
        "ส่งรีวิวไม่สำเร็จ: " +
        error.message
      );

    }

    return;

  }


  closeModal(
    "reviewModal"
  );


  showToast(
    "⭐ ขอบคุณสำหรับรีวิว"
  );


  await loadOrders();


  if(currentProduct){

    await showProductDetail(
      currentProduct
    );

  }

}

function initializeMessaging(){

  if(!currentUser) return;


  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "messages-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            `receiver_id=eq.${currentUser.id}`
        },
        async payload=>{

          const message =
            payload.new;


          if(
            message.sender_id ===
            currentUser.id
          ){

            return;

          }


          if(
            knownMessageIds.has(
              message.id
            )
          ){

            return;

          }


          knownMessageIds.add(
            message.id
          );


          notifyUser(
            "💬 มีข้อความใหม่",
            message.message
          );


          await updateMessageBadge();


          if(
            currentChatUserId ===
            message.sender_id
          ){

            await loadChatMessages();

          }

        }
      )
      .subscribe();

}


function stopRealtime(){

  if(realtimeChannel){

  }


  if(orderRealtimeChannel){

    supabaseClient

    orderRealtimeChannel =

  }

}

async function loadInbox(){

  const container =
    document.getElementById(
      "inboxList"
    );


  container.innerHTML =
    `<div class="loading">
      กำลังโหลด...
    </div>`;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    container.innerHTML =
      `<div class="empty">
        โหลดข้อความไม่สำเร็จ
      </div>`;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    container.innerHTML =
      `<div class="empty">
        ยังไม่มีข้อความ
      </div>`;

    return;

  }


  const groups = {};


  for(
    const msg of data
  ){

    const otherUser =
      msg.sender_id ===
      currentUser.id
      ?
      msg.receiver_id
      :
      msg.sender_id;


    const key =
      otherUser +
      "|" +
      (
        msg.product_id ||
        ""
      );


    if(!groups[key]){

      groups[key] = {

        otherUser,

        productId:
          msg.product_id,

        message:
          msg

      };

    }

  }


  container.innerHTML =
    "";


  for(
    const key of Object.keys(
      groups
    )
  ){

    const item =
      groups[key];


    let productTitle =
      "สินค้า";


    if(item.productId){

      const {
        data:product
      } =
        await supabaseClient
          .from("products")
          .select("title")
          .eq(
            "id",
            item.productId
          )
          .maybeSingle();


      if(product){

        productTitle =
          product.title;

      }

    }


    const {
      data:profile
    } =
      await supabaseClient
        .from("profiles")
        .select("display_name")
        .eq(
          "id",
          item.otherUser
        )
        .maybeSingle();


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "inbox-item";


    div.innerHTML = `

      <div class="inbox-title">

        💬 ${escapeHTML(
          profile?.display_name ||
          "ผู้ใช้ PC2Deal"
        )}

      </div>

      <div class="inbox-preview">

        📦 ${escapeHTML(
          productTitle
        )}

      </div>

      <div class="inbox-preview">

        ${escapeHTML(
          item.message.message
        )}

      </div>

    `;


    div.addEventListener(
      "click",
      ()=>{
        openChat(
          item.otherUser,
          item.productId,
          productTitle
        );
      }
    );


    container.appendChild(
      div
    );

  }

}

  productId,
  productTitle
){

  if(!currentUser){

  }


  currentChatUserId =

async function loadChatMessages(){

  if(
    !currentUser ||
    !currentChatUserId
  ){

    return;

  }


  let query =
    supabaseClient
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUserId}),and(sender_id.eq.${currentChatUserId},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(currentChatProductId){

    query =
      query.eq(
        "product_id",
        currentChatProductId
      );

  }


  const {
    data,
    error
  } =
    await query;


  const container =
    document.getElementById(
      "chatMessages"
    );


  if(error){

    container.innerHTML =
      `<div class="empty">
        โหลดแชตไม่สำเร็จ
      </div>`;

    return;

  }


  container.innerHTML =
    "";


  for(
    const msg of
    data || []
  ){

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "message " +
      (
        msg.sender_id ===
        currentUser.id
        ?
        "mine"
        :
        "other"
      );


    div.innerHTML = `

      <div>
        ${escapeHTML(
          msg.message
        )}
      </div>

      <div class="message-time">

        ${formatDate(
          msg.created_at
        )}

      </div>

    `;


    container.appendChild(
      div
    );

  }


  container.scrollTop =
    container.scrollHeight;

}


async function sendMessage(){

    !currentUser ||
    !currentChatUserId
  ){

    return;

  }


  const input =
    document.getElementById(
      "chatInput"
    );


  const message =

========================= */

function initializeOrderRealtime(){

  if(!currentUser) return;


  if(orderRealtimeChannel){

    supabaseClient
      .removeChannel(
        orderRealtimeChannel
      );

  }


  orderRealtimeChannel =
    supabaseClient
      .channel(
        "orders-" +
        currentUser.id
      )


      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"orders",
          filter:
            `seller_id=eq.${currentUser.id}`
        },
        payload=>{

          const order =
            payload.new;


          if(
            order.status ===
            "pending"
          ){

            notifyUser(
              "📦 มีออเดอร์ใหม่",
              order.product_title
            );


            updateOrderBadge();

          }

        }
      )


      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"orders"
        },
        payload=>{

          const oldOrder =
            payload.old;


          const order =
            payload.new;


          const isBuyer =
            order.buyer_id ===
            currentUser.id;


          const isSeller =
            order.seller_id ===
            currentUser.id;


          if(
            !isBuyer &&
            !isSeller
          ){

            return;

          }


          if(
            oldOrder.status ===
            order.status
          ){

            return;

          }


          const isSellerSide =
            isSeller;


          let text = "";


          if(
            order.status ===
            "confirmed"
          ){

            text =
              isSellerSide
              ?
              "คุณยืนยันออเดอร์แล้ว"
              :
              "ผู้ขายยืนยันออเดอร์แล้ว";

          }else if(
            order.status ===
            "shipping"
          ){

            text =
              isSellerSide
              ?
              "กำลังเตรียมจัดส่งสินค้า"
              :
              "ผู้ขายกำลังจัดส่งสินค้า";

          }else if(
            order.status ===
            "shipped"
          ){

            text =
              isSellerSide
              ?
              "แจ้งจัดส่งสินค้าแล้ว"
              :
              "ผู้ขายจัดส่งสินค้าแล้ว";

          }else if(
            order.status ===
            "completed"
          ){

            text =
              isSellerSide
              ?
              "ออเดอร์ซื้อขายสำเร็จแล้ว"
              :
              "ซื้อขายสำเร็จแล้ว ⭐";

          }else if(
            order.status ===
            "cancelled"
          ){

            text =
              "ออเดอร์ถูกยกเลิก";

          }


          if(text){

            notifyUser(
              "📦 อัปเดตออเดอร์",
              text +
              "\n" +
              order.product_title
            );

          }


          updateOrderBadge();


          if(
            document
              .getElementById(
                "ordersModal"
              )
              .classList
              .contains("active")
          ){

            loadOrders();

          }

        }
      )


      .subscribe();

}


/* =========================
   ORDER BADGE
========================= */

async function updateOrderBadge(){

  if(!currentUser){

    return;

  }


  const {
    data:sellerOrders
  } =
    await supabaseClient
      .from("orders")
      .select(
        "id,status"
      )
      .eq(
        "seller_id",
        currentUser.id
      )
      .eq(
        "status",
        "pending"
      );


  const {
    data:buyerOrders
  } =
    await supabaseClient
      .from("orders")
      .select(
        "id,status"
      )
      .eq(
        "buyer_id",
        currentUser.id
      )
      .in(
        "status",
        [
          "confirmed",
          "shipped"
        ]
      );


  const count =
    (
      sellerOrders?.length ||
      0
    ) +
    (
      buyerOrders?.length ||
      0
    );


  const badge =
    document.getElementById(
      "orderBadge"
    );


  if(count > 0){

    badge.textContent =
      count > 99
      ?
      "99+"
      :
      count;


    badge.style.display =
      "inline-flex";

  }else{

    badge.style.display =
      "none";

  }

}


/* =========================
   NOTIFICATIONS
========================= */

function notifyUser(
  title,
  message
){

  showToast(
    title +
    "\n" +
    message
  );


  if(
    "Notification" in
    window
  ){

    if(
      Notification.permission ===
      "granted"
    ){

      try{

        new Notification(
          title,
          {
            body:
              message,

            icon:
              "https://placehold.co/128x128?text=PC2"
          }
        );

      }catch(e){}


    }else if(
      Notification.permission ===
      "default"
    ){

      Notification
        .requestPermission()
        .catch(
          ()=>{}
        );

    }

  }

}


/* =========================
   POLLING
========================= */

function startPolling(){

  if(pollingTimer){

    clearInterval(
      pollingTimer
    );

  }


  pollingTimer =
    setInterval(
      async()=>{

        if(!currentUser) return;


        await checkForNewMessages();

        await updateOrderBadge();


        if(
          document
            .getElementById(
              "ordersModal"
            )
            .classList
            .contains("active")
        ){

          await loadOrders();

        }


        if(
          document
            .getElementById(
              "chatModal"
            )
            .classList
            .contains("active")
        ){

          await loadChatMessages();

        }

      },
      3000
    );

}
